<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LlamaIndex chunks at 1,024 tokens by default. Measured on 478,000 characters of Wikipedia, that budget holds 4,731 characters of English and 1,157 of Greek. Move the sentence, watch the cuts."
    />
    <!--
      An icon, inline, so there is no second request and no 404 in the console of
      the first reader who opens it. Two rules across a page, which is the thing
      this site draws.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23080604'/%3E%3Cg fill='%239a8f88'%3E%3Crect x='2' y='3' width='12' height='1'/%3E%3Crect x='2' y='6' width='9' height='1'/%3E%3Crect x='2' y='12' width='11' height='1'/%3E%3C/g%3E%3Crect x='2' y='9' width='12' height='1' fill='%23ff6a00'/%3E%3C/svg%3E"
    />
    <!--
      CNET-F1. The noscript block tells a visitor this page "tokenises text in
      your browser", and until tick 190 nothing enforced it. Measured then on
      the built page: 6 requests, 5 on load and one when the second vocabulary
      was picked, every one to this origin, and nothing in localStorage,
      sessionStorage, cookies or a service worker.

      The policy is stricter than `watch-it-think`'s because this page needs
      less: no `'wasm-unsafe-eval'` and no `blob:`, because `gpt-tokenizer` is
      javascript and there is no model to compile and no worker to start. A
      policy copied from a project that needs more is a policy that permits what
      this page has no use for.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>chunkline</title>
  </head>
  <body>
    <header>
      <p class="wordmark">CHUNKLINE</p>
      <h1 data-headline>A 1,024 token chunk holds four times as much English as Greek.</h1>
      <p class="standfirst" data-standfirst></p>
    </header>

    <main>
      <!--
        The control, and the only one. A budget is the single number a person
        setting up retrieval actually chooses, so it is the single thing this
        page lets them move.
      -->
      <!--
        Both controls ship disabled, and the module enables them when the
        vocabulary is here.

        Swept out of watch-it-think's WH-F4 at tick 166. They used to ship
        usable, and `render()` has no readiness guard: `encoderFor` throws
        "o200k was not loaded before it was drawn with", inside an event
        listener, where nothing a visitor can see happens. Two megabytes arrive
        before either control can do anything, and disabled in the markup
        rather than in script is the difference between a second of honesty and
        a second of a control that lies, because the module itself is part of
        what is still downloading.
      -->
      <div class="controls" data-controls aria-busy="true">
        <label class="control">
          <span class="control__label">token budget</span>
          <input type="range" data-budget min="0" max="3" step="1" value="2" list="budgets" disabled />
          <datalist id="budgets"></datalist>
          <output class="control__value" data-budget-value></output>
        </label>

        <label class="control">
          <span class="control__label">tokenizer</span>
          <select data-tokenizer disabled></select>
        </label>
      </div>

      <p class="status" data-status>loading</p>

      <!--
        And the one case where that line is a lie: with scripts off nothing here
        ever runs, so it would say loading for as long as the visitor stayed.
      -->
      <noscript>
        <style>
          [data-status], .controls { display: none }
        </style>
        <p class="status">
          This page tokenises text in your browser to draw where a chunker would
          cut it, so it needs javascript to do anything. The measurements it is
          built on are in the README, which needs none.
        </p>
      </noscript>

      <!--
        CME2-F4. The comparison this page is built on was 1,560 pixels down at
        1280x800 and the two first rules were 6,691 pixels apart on a phone, so
        a reader who did not already believe the argument met a headline and two
        columns of prose and never saw the thing being compared.

        Two bars, the same width because the two passages are the same length,
        with a tick at every cut. Same text, same budget, more cuts in Greek, in
        one glance and above the fold at both widths. The columns underneath are
        the evidence for it rather than the statement of it.
      -->
      <figure class="glance" data-glance>
        <div class="glance__row">
          <span class="glance__label">English</span>
          <div class="glance__bar" data-glance-bar="en"></div>
          <span class="glance__count" data-glance-count="en"></span>
        </div>
        <div class="glance__row">
          <span class="glance__label" lang="en">Greek</span>
          <div class="glance__bar" data-glance-bar="el"></div>
          <span class="glance__count" data-glance-count="el"></span>
        </div>
        <figcaption class="glance__caption" data-glance-caption></figcaption>
      </figure>

      <section class="columns" data-columns>
        <article class="column">
          <h2 class="column__head">
            <span data-lang-name>English</span>
            <span class="column__meta" data-meta-en></span>
          </h2>
          <div class="passage" data-passage="en"></div>
        </article>
        <article class="column">
          <h2 class="column__head">
            <span>Greek</span>
            <span class="column__meta" data-meta-el></span>
          </h2>
          <!--
            The Greek passage says it is Greek. Swept out of watch-it-think's
            WP-F11 at tick 177: this column is 600 characters of Greek inside a
            document that declares lang="en", so a screen reader reads it with
            an English voice, and the whole point of the column is that a Greek
            reader can compare it with the English one.
          -->
          <div class="passage" lang="el" data-passage="el"></div>
        </article>
      </section>

      <p class="caption" data-caption></p>
    </main>

    <footer data-footer></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
